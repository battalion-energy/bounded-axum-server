[package]
name = "bounded-axum-server"
version = "0.1.0"
edition = "2021"
publish = false
description = "Reference Axum + Hyper HTTP/1.1 + Tower server demonstrating provable resource limits over a Unix socket"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["server-graceful", "service", "tokio"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.6", features = ["limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde_json = "1"
tempfile = "3"
